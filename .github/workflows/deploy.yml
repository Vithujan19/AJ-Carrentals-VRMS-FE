name: Frontend CI and FTPS deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aj-car-rentals-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build production client
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload compiled client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aj-car-rentals-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production client via explicit FTPS
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Download compiled client
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: aj-car-rentals-frontend-dist
          path: dist/

      - name: Validate deployment configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ./
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const required = ['FTP_SERVER', 'FTP_USERNAME', 'FTP_PASSWORD', 'VITE_API_BASE_URL'];
          for (const name of required) {
            if (!process.env[name]?.trim()) {
              console.error(`Missing required GitHub secret or variable: ${name}`);
              process.exit(1);
            }
          }

          let api;
          try {
            api = new URL(process.env.VITE_API_BASE_URL);
          } catch {
            console.error('VITE_API_BASE_URL must be an absolute HTTPS URL.');
            process.exit(1);
          }
          if (api.protocol !== 'https:' || api.username || api.password || api.search || api.hash ||
              !api.pathname.replace(/\/$/, '').endsWith('/api')) {
            console.error('VITE_API_BASE_URL must be an HTTPS API URL ending in /api, without credentials or query values.');
            process.exit(1);
          }

          NODE

      - name: Deploy dist using explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: dist/
          server-dir: ./
          log-level: minimal
